<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" href="/assets/favicon.ico/favicon.ico" type="image/x-icon" />
		<title>Customs Manager</title>
		<meta name="description" content="Create balanced League of Legends teams" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
		/>
		<!--
			Do NOT link /assets/css/styles.css here. It's the old portfolio sheet,
			and its global `button { opacity: 0; width: 100% }` rule hides every
			button on this page. Everything this page needs is in the block below.
		-->
		<style>
	html,
	body {
		background: linear-gradient(
			120deg,
			#1f2d46 0%,
			#263141 30%,
			#2f2a36 55%,
			#352428 70%,
			#3a2024 100%
		);
		min-height: 100vh;
	}

	html {
		background: #1f2d46;
	}

	/* ==========================================================================
	   Customs Manager — component styles.
	   Self-contained on purpose: this page ships outside the Astro build, so it
	   can't reach src/styles/global.css. Tokens are local, but color values are
	   sampled from the main site's palette (--bone/--dim/--faint/--ember) so it
	   still feels like the same place.
	   ========================================================================== */

	* {
		box-sizing: border-box;
	}

	body {
		margin: 0;
		color: #f2ebdd;
		font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
	}

	.teamgen-page {
		max-width: 74rem;
		margin: 0 auto;
		padding: clamp(1.5rem, 5vw, 3.5rem) clamp(1.25rem, 4vw, 2.5rem) 5rem;
	}

	/* --- hero --- */

	.teamgen-hero {
		display: flex;
		flex-wrap: wrap;
		align-items: flex-end;
		justify-content: space-between;
		gap: 1rem;
		margin-bottom: 2rem;
		padding-bottom: 1.5rem;
		border-bottom: 1px solid rgba(242, 235, 221, 0.14);
	}

	.teamgen-title {
		margin: 0;
		font-family: "Oxanium", "Space Grotesk", sans-serif;
		font-weight: 600;
		font-size: clamp(1.8rem, 4vw, 2.6rem);
		letter-spacing: -0.01em;
		color: #f2ebdd;
	}

	.teamgen-subtitle {
		margin: 0.4rem 0 0;
		color: #c3b7a8;
		font-size: 0.95rem;
	}


	/* --- panel + quickbars --- */

	.teamgen-panel {
		background: rgba(20, 20, 30, 0.42);
		border: 1px solid rgba(242, 235, 221, 0.12);
		border-radius: 16px;
		padding: clamp(1.1rem, 3vw, 1.8rem);
		backdrop-filter: blur(10px);
	}

	.teamgen-quickbar {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		justify-content: space-between;
		gap: 0.75rem 1.5rem;
		padding: 0.75rem 0;
		border-bottom: 1px solid rgba(242, 235, 221, 0.1);
	}

	.teamgen-quickbar-title {
		font-family: "Oxanium", sans-serif;
		font-size: 0.68rem;
		letter-spacing: 0.16em;
		text-transform: uppercase;
		color: #8c8074;
	}

	.teamgen-quickbar-actions {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		gap: 0.6rem;
	}

	/* --- inputs + buttons --- */

	.teamgen-input {
		background: rgba(255, 255, 255, 0.05);
		border: 1px solid rgba(242, 235, 221, 0.16);
		border-radius: 8px;
		color: #f2ebdd;
		font: inherit;
		font-size: 0.9rem;
		padding: 0.5rem 0.7rem;
	}

	.teamgen-input:focus-visible,
	select.teamgen-input:focus-visible {
		outline: 2px solid #ff8a3c;
		outline-offset: 1px;
	}


	.teamgen-button {
		font-family: "Oxanium", sans-serif;
		font-size: 0.78rem;
		font-weight: 600;
		letter-spacing: 0.06em;
		text-transform: uppercase;
		color: #1a1410;
		background: #ff8a3c;
		border: none;
		border-radius: 8px;
		padding: 0.6rem 1.1rem;
		cursor: pointer;
		transition:
			transform 0.15s ease,
			background-color 0.15s ease;
	}

	.teamgen-button:hover {
		background: #ffa564;
	}

	.teamgen-button:active {
		transform: translateY(1px);
	}

	.teamgen-button.ghost {
		color: #f2ebdd;
		background: transparent;
		border: 1px solid rgba(242, 235, 221, 0.22);
	}

	.teamgen-button.ghost:hover {
		background: rgba(242, 235, 221, 0.08);
		border-color: rgba(242, 235, 221, 0.4);
	}

	/* --- roster paste/export --- */



	/* --- player table --- */

	.teamgen-table {
		display: grid;
		grid-template-columns: minmax(0, 1fr) 5.5rem auto auto;
		align-items: center;
		gap: 0.6rem 1rem;
		margin-top: 1.5rem;
	}

	.teamgen-header {
		font-family: "Oxanium", sans-serif;
		font-size: 0.62rem;
		letter-spacing: 0.16em;
		text-transform: uppercase;
		color: #8c8074;
		padding-bottom: 0.4rem;
		border-bottom: 1px solid rgba(242, 235, 221, 0.14);
	}

	.teamgen-row {
		display: contents;
	}

	.teamgen-row > .teamgen-role-selector,
	.teamgen-row > .teamgen-row-actions {
		padding: 0.5rem 0;
		border-bottom: 1px solid rgba(242, 235, 221, 0.07);
	}

	.teamgen-row .rank {
		width: 100%;
		text-align: center;
	}

	.teamgen-role-selector {
		display: flex;
		align-items: center;
		gap: 0.35rem;
	}

	.teamgen-role-button {
		display: flex;
		align-items: center;
		justify-content: center;
		width: 2.1rem;
		height: 2.1rem;
		padding: 0.3rem;
		background: rgba(255, 255, 255, 0.04);
		border: 1px solid rgba(242, 235, 221, 0.14);
		border-radius: 8px;
		cursor: pointer;
		transition:
			border-color 0.15s ease,
			background-color 0.15s ease;
	}

	.teamgen-role-button img {
		width: 100%;
		height: 100%;
		object-fit: contain;
		opacity: 0.55;
		filter: grayscale(0.3);
	}

	.teamgen-role-button:hover {
		border-color: rgba(242, 235, 221, 0.35);
	}

	.teamgen-role-button.is-preferred {
		background: rgba(255, 138, 60, 0.18);
		border-color: #ff8a3c;
	}

	.teamgen-role-button.is-preferred img {
		opacity: 1;
		filter: none;
	}

	.teamgen-role-button.is-offrole {
		background: rgba(91, 140, 255, 0.16);
		border-color: #5b8cff;
	}

	.teamgen-role-button.is-offrole img {
		opacity: 1;
		filter: none;
	}







	.teamgen-row-actions {
		display: flex;
		gap: 0.4rem;
	}

	.teamgen-row-button {
		width: 1.9rem;
		height: 1.9rem;
		line-height: 1;
		background: rgba(255, 255, 255, 0.04);
		border: 1px solid rgba(242, 235, 221, 0.14);
		border-radius: 6px;
		color: #c3b7a8;
		cursor: pointer;
		font-size: 1rem;
	}

	.teamgen-row-button:hover {
		color: #f2ebdd;
		border-color: rgba(242, 235, 221, 0.35);
	}

	.teamgen-row-add:hover {
		border-color: #c8aa6e;
		color: #c8aa6e;
	}

	.teamgen-row-remove:hover {
		border-color: #ff5b6b;
		color: #ff5b6b;
	}

	/* --- generate bar --- */

	.teamgen-actions {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		gap: 1rem 1.5rem;
		margin-top: 1.75rem;
		padding-top: 1.25rem;
		border-top: 1px solid rgba(242, 235, 221, 0.12);
	}

	.teamgen-toggle {
		display: flex;
		align-items: center;
		gap: 0.5rem;
		font-size: 0.85rem;
		color: #c3b7a8;
		cursor: pointer;
	}

	.teamgen-toggle input {
		accent-color: #ff8a3c;
		width: 1rem;
		height: 1rem;
	}

	.teamgen-error {
		flex-basis: 100%;
		color: #ff5b6b;
		font-size: 0.85rem;
		min-height: 1.2em;
	}

	/* --- output --- */

	.teamgen-output {
		display: grid;
		grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr));
		gap: 1.25rem;
		margin-top: 2rem;
	}

	.teamgen-output-card {
		background: rgba(91, 140, 255, 0.08);
		border: 1px solid rgba(91, 140, 255, 0.3);
		border-radius: 14px;
		padding: 1.25rem 1.4rem;
	}

	.teamgen-output-card h2 {
		margin: 0;
		font-family: "Oxanium", sans-serif;
		font-size: 1.1rem;
		color: #a9c1ff;
	}

	.teamgen-output-card-red {
		background: rgba(255, 91, 107, 0.08);
		border-color: rgba(255, 91, 107, 0.3);
	}

	.teamgen-output-card-red h2 {
		color: #ffaab2;
	}

	.teamgen-output-meta {
		margin: 0.35rem 0 1rem;
		font-size: 0.8rem;
		color: #8c8074;
	}

	.teamgen-list {
		list-style: none;
		margin: 0;
		padding: 0;
		display: grid;
		gap: 0.5rem;
	}

	.teamgen-list-item {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 0.75rem;
		padding: 0.5rem 0.65rem;
		background: rgba(255, 255, 255, 0.04);
		border-radius: 8px;
	}

	.teamgen-player-block {
		display: flex;
		flex-direction: column;
		gap: 0.1rem;
	}

	.teamgen-player {
		font-size: 0.92rem;
		color: #f2ebdd;
	}

	.teamgen-rank {
		font-size: 0.68rem;
		color: #8c8074;
	}

	.teamgen-role {
		display: flex;
		align-items: center;
		gap: 0.35rem;
		font-size: 0.7rem;
		letter-spacing: 0.06em;
		text-transform: uppercase;
		color: #c3b7a8;
		padding: 0.25rem 0.55rem;
		border-radius: 999px;
		background: rgba(255, 255, 255, 0.06);
	}

	.teamgen-role img {
		width: 1rem;
		height: 1rem;
		object-fit: contain;
	}

	.teamgen-role-primary {
		background: rgba(255, 138, 60, 0.18);
		color: #ffb98a;
	}

	.teamgen-role-secondary {
		background: rgba(91, 140, 255, 0.16);
		color: #a9c1ff;
	}

	.teamgen-role-autofill {
		background: rgba(200, 170, 110, 0.14);
		color: #dcc48f;
	}

	/* --- narrow viewports: table becomes stacked cards --- */

	@media (max-width: 44rem) {
		.teamgen-table {
			grid-template-columns: 1fr;
		}

		/* Named areas rather than auto-placement: DOM order is name, rank,
		   roles, actions, but the mobile layout needs actions beside rank —
		   out of source order — and auto-placement can't do that without
		   colliding with the full-width name row. */
		.teamgen-row {
			display: grid;
			grid-template-columns: 1fr auto;
			grid-template-areas:
				"name name"
				"rank actions"
				"roles roles";
			gap: 0.5rem 0.75rem;
			padding: 0.75rem 0;
			border-bottom: 1px solid rgba(242, 235, 221, 0.1);
		}

		.teamgen-row > .name {
			grid-area: name;
		}

		.teamgen-row > .rank {
			grid-area: rank;
			width: auto;
			justify-self: start;
		}

		.teamgen-row > .teamgen-role-selector {
			grid-area: roles;
			border-bottom: none;
			padding-top: 0;
		}

		.teamgen-row > .teamgen-row-actions {
			grid-area: actions;
			justify-self: end;
			align-self: center;
			border-bottom: none;
		}

		/* The header strip is 4 separate grid children of .teamgen-table, not
		   part of a .teamgen-row — at one column they'd stack as four bare
		   labels above the list. The placeholders inside each row already
		   carry that context, so drop the header entirely instead. */
		.teamgen-header {
			display: none;
		}
	}

	/* --- additions on top of the original component styles --- */

	.teamgen-quickbar:first-child {
		padding-top: 0;
	}

	.teamgen-save-status {
		font-size: 0.8rem;
		color: #8c8074;
	}

	.teamgen-save-status.is-dirty {
		color: #ffb98a;
	}

	.teamgen-button[hidden] {
		display: none;
	}

	/* Fill: lit whenever the player has no roles picked; clicking it clears them. */
	.teamgen-fill-button {
		display: flex;
		align-items: center;
		gap: 0.3rem;
		height: 2.1rem;
		margin-left: 0.15rem;
		padding: 0 0.55rem 0 0.35rem;
		background: transparent;
		border: 1px dashed rgba(242, 235, 221, 0.22);
		border-radius: 8px;
		color: #8c8074;
		font-family: "Oxanium", sans-serif;
		font-size: 0.7rem;
		font-weight: 600;
		letter-spacing: 0.08em;
		text-transform: uppercase;
		cursor: pointer;
	}

	.teamgen-fill-button img {
		width: 1.2rem;
		height: 1.2rem;
		object-fit: contain;
		opacity: 0.5;
	}

	.teamgen-fill-button:hover {
		border-color: rgba(242, 235, 221, 0.4);
		color: #f2ebdd;
	}

	.teamgen-fill-button.is-active {
		border-style: solid;
		border-color: #c8aa6e;
		background: rgba(200, 170, 110, 0.12);
		color: #dcc48f;
	}

	.teamgen-fill-button.is-active img {
		opacity: 1;
	}

	.teamgen-row.is-invalid > .teamgen-input.name {
		border-color: #ff5b6b;
	}

	/* "Ignore roles": drop the role column entirely. */
	.teamgen-table.no-roles {
		grid-template-columns: minmax(0, 1fr) 5.5rem auto;
	}

	.teamgen-table.no-roles .teamgen-role-selector,
	.teamgen-table.no-roles .teamgen-header-roles,
	.teamgen-table.no-roles + .teamgen-hint {
		display: none;
	}

	.teamgen-hint {
		margin: 0.9rem 0 0;
		font-size: 0.8rem;
		color: #8c8074;
	}

	.teamgen-output[hidden] {
		display: none;
	}

	.teamgen-toast {
		position: fixed;
		left: 50%;
		bottom: 1.25rem;
		z-index: 10;
		max-width: calc(100vw - 32px);
		padding: 0.55rem 1rem;
		border-radius: 10px;
		background: #f2ebdd;
		color: #1a1410;
		font-size: 0.88rem;
		font-weight: 500;
		box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
		transform: translate(-50%, 1rem);
		opacity: 0;
		pointer-events: none;
		transition: opacity 0.2s ease, transform 0.2s ease;
	}

	.teamgen-toast.is-visible {
		opacity: 1;
		transform: translate(-50%, 0);
	}

	@media (max-width: 44rem) {
		.teamgen-page {
			padding-left: 16px;
			padding-right: 16px;
		}

		.teamgen-role-selector {
			flex-wrap: wrap;
		}

		.teamgen-table.no-roles .teamgen-row {
			grid-template-areas:
				"name name"
				"rank actions";
		}
	}
		</style>
	</head>

	<body>
		<div class="teamgen-page">
			<header class="teamgen-hero">
				<div class="teamgen-hero-inner">
					<h1 class="teamgen-title">Customs Manager</h1>
					<p class="teamgen-subtitle">League of Legends custom lobby balancer</p>
				</div>
			</header>

			<section class="teamgen-panel">
				<div class="teamgen-quickbar">
					<div class="teamgen-quickbar-title">Lobby</div>
					<div class="teamgen-quickbar-actions">
						<span id="teamgen-save-status" class="teamgen-save-status" aria-live="polite"></span>
						<button id="teamgen-save" class="teamgen-button ghost" type="button">Save lobby</button>
						<button id="teamgen-clear" class="teamgen-button ghost" type="button">Clear</button>
					</div>
				</div>

				<div class="teamgen-table" id="teamgen-table">
					<div class="teamgen-header">Player</div>
					<div class="teamgen-header">Rank (1-10)</div>
					<div class="teamgen-header teamgen-header-roles">Roles</div>
					<div class="teamgen-header"></div>
				</div>

				<p class="teamgen-hint">
					Roles are optional. Click a role once for main, another for secondary; leave it on
					<strong>Fill</strong> if they'll play anything. Blank rows are skipped.
				</p>

				<div class="teamgen-actions">
					<button id="teamgen-generate" class="teamgen-button" type="button">Generate teams</button>
					<button id="teamgen-reroll" class="teamgen-button ghost" type="button" hidden>Reroll</button>
					<label class="teamgen-toggle">
						<input id="teamgen-ignore-roles" type="checkbox" />
						<span>Ignore roles</span>
					</label>
					<div id="teamgen-error" class="teamgen-error" role="alert"></div>
				</div>
			</section>

			<section id="teamgen-output" class="teamgen-output" hidden>
				<div class="teamgen-output-card">
					<h2>Team Blue</h2>
					<p class="teamgen-output-meta"></p>
					<ul class="teamgen-list"></ul>
				</div>
				<div class="teamgen-output-card teamgen-output-card-red">
					<h2>Team Red</h2>
					<p class="teamgen-output-meta"></p>
					<ul class="teamgen-list"></ul>
				</div>
			</section>
		</div>

		<div id="teamgen-toast" class="teamgen-toast" role="status" aria-live="polite"></div>

		<script>
			const ROLES = ["top", "jgl", "mid", "bot", "sp"];
			const ROLE_NAMES = { top: "Top", jgl: "Jungle", mid: "Mid", bot: "Bot", sp: "Support" };
			const ROLE_LABELS = { top: "top", jgl: "jgl", mid: "mid", bot: "bot", sp: "sup" };
			const ICON = "/assets/league%20icons/";
			const ROLE_ICONS = {
				top: ICON + "120px-Top_icon.png",
				jgl: ICON + "Jungle_icon_WR.png",
				mid: ICON + "120px-Middle_icon.png",
				bot: ICON + "Bottom_icon.png",
				sp: ICON + "120px-Support_icon.png",
				fill: ICON + "120px-Specialist_icon.png",
			};
			const ROWS = 10;
			// Same key the old auto-save used, so whatever was there preloads.
			const SAVE_KEY = "teamgen-roster-v1";

			const $ = (id) => document.getElementById(id);
			const table = $("teamgen-table");
			const errorBox = $("teamgen-error");
			const ignoreRoles = $("teamgen-ignore-roles");
			const output = $("teamgen-output");

			const ROLE_ALIASES = {
				top: "top",
				jgl: "jgl", jg: "jgl", jng: "jgl", jungle: "jgl",
				mid: "mid", middle: "mid",
				bot: "bot", adc: "bot", bottom: "bot",
				sp: "sp", sup: "sp", supp: "sp", support: "sp",
			};
			const normalizeRole = (v) => ROLE_ALIASES[String(v || "").trim().toLowerCase()] || "";

			// ---------- rows ----------

			const buildRow = (i) => {
				const row = document.createElement("div");
				row.className = "teamgen-row";
				row.innerHTML = `
					<input class="teamgen-input name" type="text" placeholder="Player ${i + 1}" aria-label="Player ${i + 1} name" maxlength="24" autocomplete="off" />
					<input class="teamgen-input rank" type="number" min="1" max="10" value="5" inputmode="numeric" aria-label="Player ${i + 1} rank" />
					<div class="teamgen-role-selector" role="group" aria-label="Player ${i + 1} roles">
						${ROLES.map((r) => `
							<button class="teamgen-role-button" type="button" data-role="${r}" title="${ROLE_NAMES[r]}" aria-pressed="false">
								<img src="${ROLE_ICONS[r]}" alt="${ROLE_NAMES[r]}" />
							</button>`).join("")}
						<button class="teamgen-fill-button" type="button" title="Plays anything (clears roles)" aria-pressed="true">
							<img src="${ROLE_ICONS.fill}" alt="" />Fill
						</button>
					</div>
					<div class="teamgen-row-actions">
						<button class="teamgen-row-button teamgen-row-remove" type="button" title="Clear row" aria-label="Clear player ${i + 1}">×</button>
					</div>`;
				row.dataset.preferred = "";
				row.dataset.offrole = "";
				return row;
			};

			for (let i = 0; i < ROWS; i += 1) table.appendChild(buildRow(i));
			const rows = Array.from(table.querySelectorAll(".teamgen-row"));

			const setRoles = (row, preferred, offrole) => {
				preferred = normalizeRole(preferred);
				offrole = normalizeRole(offrole);
				if (offrole === preferred) offrole = "";
				row.dataset.preferred = preferred;
				row.dataset.offrole = offrole;
				row.querySelectorAll(".teamgen-role-button").forEach((b) => {
					const r = b.dataset.role;
					b.classList.toggle("is-preferred", r === preferred);
					b.classList.toggle("is-offrole", r === offrole);
					b.setAttribute("aria-pressed", String(r === preferred || r === offrole));
				});
				const fill = row.querySelector(".teamgen-fill-button");
				fill.classList.toggle("is-active", !preferred);
				fill.setAttribute("aria-pressed", String(!preferred));
			};

			const readRow = (row) => ({
				name: row.querySelector(".name").value.trim(),
				skill: parseInt(row.querySelector(".rank").value, 10),
				preferred: row.dataset.preferred,
				offrole: row.dataset.offrole,
			});

			const writeRow = (row, p = {}) => {
				row.querySelector(".name").value = p.name || "";
				const skill = parseInt(p.skill, 10);
				row.querySelector(".rank").value = skill >= 1 && skill <= 10 ? skill : 5;
				setRoles(row, p.preferred, p.offrole);
				row.classList.remove("is-invalid");
			};

			// First click = main, second = secondary, a third restarts as main.
			// Clicking the main again promotes the secondary.
			const clickRole = (row, role) => {
				const { preferred, offrole } = row.dataset;
				if (role === preferred) setRoles(row, offrole, "");
				else if (role === offrole) setRoles(row, preferred, "");
				else if (!preferred) setRoles(row, role, "");
				else if (!offrole) setRoles(row, preferred, role);
				else setRoles(row, role, "");
			};

			table.addEventListener("click", (e) => {
				const row = e.target.closest(".teamgen-row");
				if (!row) return;
				const roleBtn = e.target.closest(".teamgen-role-button");
				if (roleBtn) clickRole(row, roleBtn.dataset.role);
				else if (e.target.closest(".teamgen-fill-button")) setRoles(row, "", "");
				else if (e.target.closest(".teamgen-row-remove")) writeRow(row);
				else return;
				updateSaveStatus();
			});

			table.addEventListener("input", (e) => {
				e.target.closest(".teamgen-row")?.classList.remove("is-invalid");
				updateSaveStatus();
			});

			// Enter in a name jumps to the next row's name.
			table.addEventListener("keydown", (e) => {
				if (e.key !== "Enter" || !e.target.classList.contains("name")) return;
				e.preventDefault();
				const next = rows[rows.indexOf(e.target.closest(".teamgen-row")) + 1];
				(next ? next.querySelector(".name") : $("teamgen-generate")).focus();
			});

			// ---------- save / load ----------

			const snapshot = () => JSON.stringify(rows.map(readRow).map((p) => (p.name ? p : null)));
			let savedSnapshot = null;

			const loadSaved = () => {
				try {
					const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
					if (!Array.isArray(saved)) return;
					const players = saved.filter((p) => p && String(p.name || "").trim());
					rows.forEach((row, i) => writeRow(row, players[i]));
					savedSnapshot = snapshot();
				} catch {}
			};

			const updateSaveStatus = () => {
				const el = $("teamgen-save-status");
				const empty = rows.every((r) => !r.querySelector(".name").value.trim());
				const dirty = snapshot() !== savedSnapshot && !(empty && savedSnapshot === null);
				el.textContent = dirty ? "Unsaved changes" : savedSnapshot ? "Saved" : "";
				el.classList.toggle("is-dirty", dirty);
			};

			$("teamgen-save").addEventListener("click", () => {
				const players = rows.map(readRow).filter((p) => p.name);
				try {
					localStorage.setItem(SAVE_KEY, JSON.stringify(players));
					savedSnapshot = snapshot();
					toast(players.length ? `Saved ${players.length} players — they'll be here next time` : "Saved an empty lobby");
				} catch {
					toast("Couldn't save — browser storage is blocked");
				}
				updateSaveStatus();
			});

			$("teamgen-clear").addEventListener("click", () => {
				rows.forEach((row) => writeRow(row));
				errorBox.textContent = "";
				output.hidden = true;
				$("teamgen-reroll").hidden = true;
				updateSaveStatus();
				toast("Cleared — your saved lobby is untouched until you save again");
			});

			ignoreRoles.addEventListener("change", () => {
				table.classList.toggle("no-roles", ignoreRoles.checked);
				if (!output.hidden) generate(false);
			});

			// ---------- balancing ----------

			// Mains beat secondaries beat autofill, and lower-ranked players get a
			// bigger boost for landing comfort picks. Fill players are happy anywhere.
			const roleScore = (p, role) => {
				const boost = (11 - p.skill) * 3;
				if (!p.preferred) return 100;
				if (role === p.preferred) return 120 + boost;
				if (role === p.offrole) return 70 + Math.floor(boost / 2);
				return p.skill * 4;
			};

			const bestRoles = (team) => {
				let best = null;
				let bestScore = -Infinity;
				const used = new Set();
				const pick = [];
				const walk = (i, score) => {
					if (i === team.length) {
						if (score > bestScore) [bestScore, best] = [score, [...pick]];
						return;
					}
					for (const r of ROLES) {
						if (used.has(r)) continue;
						used.add(r);
						pick.push(r);
						walk(i + 1, score + roleScore(team[i], r));
						pick.pop();
						used.delete(r);
					}
				};
				walk(0, 0);
				return { roles: best, score: bestScore };
			};

			const total = (team) => team.reduce((s, p) => s + p.skill, 0);

			// At most 10 players, so just check every split (≤126) and keep the
			// smallest rank gap. The first player always sits in team A so each
			// split is only counted once.
			const allSplits = (players) => {
				const size = Math.floor(players.length / 2);
				const [first, ...rest] = players;
				const need = players.length % 2 === 0 ? size - 1 : size;
				const out = [];
				const choose = (start, picked) => {
					if (picked.length === need) {
						const a = players.length % 2 === 0 ? [first, ...picked] : [...picked];
						out.push([a, players.filter((p) => !a.includes(p))]);
						return;
					}
					for (let i = start; i < rest.length; i += 1) {
						picked.push(rest[i]);
						choose(i + 1, picked);
						picked.pop();
					}
				};
				choose(0, []);
				return out;
			};

			const validate = (players) => {
				rows.forEach((r) => r.classList.remove("is-invalid"));
				const named = rows.filter((r) => r.querySelector(".name").value.trim());
				if (named.length < 2) return "Add at least 2 players.";
				const seen = new Map();
				for (const row of named) {
					const p = readRow(row);
					const key = p.name.toLowerCase();
					if (seen.has(key)) {
						row.classList.add("is-invalid");
						seen.get(key).classList.add("is-invalid");
						return `"${p.name}" is in the lobby twice.`;
					}
					seen.set(key, row);
					if (Number.isNaN(p.skill) || p.skill < 1 || p.skill > 10) {
						row.classList.add("is-invalid");
						return `${p.name}'s rank must be 1-10.`;
					}
				}
				return "";
			};

			let lastKey = "";
			const keyOf = (team) => team.map((p) => p.name.toLowerCase()).sort().join("|");

			const renderTeam = (card, team, withRoles) => {
				card.querySelector(".teamgen-output-meta").textContent = `Total rank: ${total(team)}`;
				const list = card.querySelector(".teamgen-list");
				list.innerHTML = "";
				for (const p of team) {
					const item = document.createElement("li");
					item.className = "teamgen-list-item";
					item.innerHTML = `
						<div class="teamgen-player-block">
							<span class="teamgen-player"></span>
							<span class="teamgen-rank">rank ${p.skill}</span>
						</div>`;
					item.querySelector(".teamgen-player").textContent = p.name;
					if (withRoles) {
						const type = !p.preferred
							? "autofill"
							: p.role === p.preferred
							? "primary"
							: p.role === p.offrole
							? "secondary"
							: "autofill";
						const tag = document.createElement("span");
						tag.className = `teamgen-role teamgen-role-${type}`;
						tag.title = !p.preferred ? "Fill" : type === "autofill" ? "Autofilled" : type === "primary" ? "Main role" : "Secondary role";
						tag.innerHTML = `<img src="${ROLE_ICONS[p.role]}" alt="" /><span>${ROLE_LABELS[p.role]}</span>`;
						item.appendChild(tag);
					}
					list.appendChild(item);
				}
			};

			const generate = (reroll) => {
				errorBox.textContent = "";
				const problem = validate();
				if (problem) {
					errorBox.textContent = problem;
					return;
				}
				const players = rows.map(readRow).filter((p) => p.name);
				const withRoles = !ignoreRoles.checked && players.length === 10;

				let splits = allSplits(players).map(([a, b]) => {
					const s = { a, b, gap: Math.abs(total(a) - total(b)), score: 0 };
					if (withRoles) {
						const ra = bestRoles(a);
						const rb = bestRoles(b);
						s.ra = ra.roles;
						s.rb = rb.roles;
						s.score = ra.score + rb.score;
					}
					return s;
				});
				const minGap = Math.min(...splits.map((s) => s.gap));
				splits = splits.filter((s) => s.gap === minGap);
				if (withRoles) {
					// Of the equally balanced splits, keep those whose role fit is
					// within one main→secondary swap of the best.
					const top = Math.max(...splits.map((s) => s.score));
					splits = splits.filter((s) => s.score >= top - 60);
				}
				const options = splits.length;
				if (reroll && options > 1) splits = splits.filter((s) => keyOf(s.a) !== lastKey && keyOf(s.b) !== lastKey);
				let pick = splits[Math.floor(Math.random() * splits.length)];
				if (Math.random() < 0.5) pick = { ...pick, a: pick.b, b: pick.a, ra: pick.rb, rb: pick.ra };
				lastKey = keyOf(pick.a);

				const build = (team, roles) => {
					const t = team.map((p, i) => ({ ...p, role: roles ? roles[i] : "" }));
					return roles ? t.sort((x, y) => ROLES.indexOf(x.role) - ROLES.indexOf(y.role)) : t.sort((x, y) => y.skill - x.skill);
				};
				const cards = output.querySelectorAll(".teamgen-output-card");
				renderTeam(cards[0], build(pick.a, pick.ra), withRoles);
				renderTeam(cards[1], build(pick.b, pick.rb), withRoles);
				cards.forEach((c) => (c.querySelector(".teamgen-output-meta").textContent += ` · gap ${minGap}`));

				if (!ignoreRoles.checked && players.length !== 10) {
					errorBox.textContent = "Roles are only assigned with a full lobby of 10.";
				}
				$("teamgen-reroll").hidden = options < 2;
				const wasHidden = output.hidden;
				output.hidden = false;
				if (wasHidden) output.scrollIntoView({ behavior: "smooth", block: "start" });
			};

			$("teamgen-generate").addEventListener("click", () => generate(false));
			$("teamgen-reroll").addEventListener("click", () => generate(true));

			// ---------- toast ----------

			let toastTimer;
			const toast = (msg) => {
				const el = $("teamgen-toast");
				el.textContent = msg;
				el.classList.add("is-visible");
				clearTimeout(toastTimer);
				toastTimer = setTimeout(() => el.classList.remove("is-visible"), 2400);
			};

			rows.forEach((row) => setRoles(row, "", ""));
			loadSaved();
			updateSaveStatus();
		</script>
	</body>
</html>

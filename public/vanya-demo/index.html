try { var s0 = JSON.parse(localStorage.getItem('vj-preview') || '{}'); ['view', 'dev', 'mode', 'art', 'side', 'hero', 'pat', 'ht', 'pk'].forEach(function (k) { if (s0[k]) st[k] = s0[k]; }); if (typeof s0.lyop === 'number') st.lyop = s0.lyop; if (false && s0.fg && typeof s0.fg === 'object') ['fl', 'rail', 'rc', 'ff', 'wx', 'lv', 'lt', 'ar'].forEach(function (k) { if (/^(old|f1|f2|f3|f4|plain|jali|arch|wood|ivory|sand|brown|raw|w|g|on|off|cur|vine|paint|drawn|none|arcade|gate|pav)$/.test(s0.fg[k])) st.fg[k] = s0.fg[k]; }); if (s0.ly && typeof s0.ly === 'object') ['ground', 'back', 'birds', 'sky', 'type'].forEach(function (k) { if (/^(lotus|lotus2|field|pieces|palace|sky|none|pair|white|image|marcellus|cormorant|script|caps)$/.test(s0.ly[k])) st.ly[k] = s0.ly[k]; }); if (st.view === 'arcade') st.view = 'garden'; if (st.view === 'open2') st.view = 'open'; if (!/^(low|hi|mango)$/.test(st.hero)) st.hero = 'low'; if (!/^(perch|court)$/.test(st.pk)) st.pk = 'perch'; if (!/^(rockies|rockies2|amber|zug|avernus|heads|northhead)$/.test(st.bg)) st.bg = 'rockies'; } catch (e) {}
if (/open/.test(location.hash)) st.view = 'open';
if (/paper|tea/.test(location.hash)) st.view = 'paper';
if (/cards/.test(location.hash)) st.view = 'cards';
if (/compactB/.test(location.hash)) st.view = 'compactB';
if (/compactN/.test(location.hash)) st.view = 'compactN';
/* three views made the cut; anything else stored falls back to Open garden. Always all events. */
if (!/^(open|compactB|compactN|cards|paper|mish|layers)$/.test(st.view)) st.view = 'compactN';
st.side = '';
var fd = document.getElementById('fd'), fp = document.getElementById('fp'), d = document.getElementById('d'), p = document.getElementById('p'), stage = document.getElementById('stage');
/* a frame only loads once it is on screen, so a phone never builds the desktop copy */
/* the preview can show any guest list: the site reads its list from one line */
function src() { return SITE.replace("var SIDE = '';", "var SIDE = '" + st.side + "';"); }
function load(f) { if (f.dataset.on) return; f.dataset.on = 1; if (SITE) f.srcdoc = src(); else f.src = 'site.html'; }
function send(m) { [fd, fp].forEach(function (f) { if (f.dataset.on && f.contentWindow) f.contentWindow.postMessage(m, '*'); }); }
function layout() {
  var real = innerWidth < 760, dev = real ? 'ph' : st.dev;
  document.body.classList.toggle('real', real);
  d.hidden = dev === 'ph'; p.hidden = dev === 'desk';
  if (!d.hidden) load(fd);
  if (!p.hidden) load(fp);
  var H = stage.clientHeight - (real ? 0 : 28), W = stage.clientWidth - (real ? 0 : 28);
  if (real) { p.style.width = '100%'; p.style.height = H + 'px'; fp.removeAttribute('width'); fp.height = H; fp.style.cssText = 'width:1px;min-width:100%;transform:none'; return; }
  fp.style.cssText = ''; fp.width = 390; fp.height = 844;
  var sp = Math.min(1, (H - 18) / 844), ph = dev === 'desk' ? 0 : 390 * sp + 18 + 24;
  var sd = Math.min(1, H / 900, (W - ph) / 1440);
  fd.style.transform = 'scale(' + sd + ')'; d.style.width = 1440 * sd + 'px'; d.style.height = 900 * sd + 'px';
  fp.style.transform = 'scale(' + sp + ')'; p.style.width = 390 * sp + 'px'; p.style.height = 844 * sp + 'px';
}
function sync() {
  document.querySelectorAll('[data-view]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.view === st.view)); });
  document.querySelectorAll('[data-dev]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.dev === st.dev)); });
  document.querySelectorAll('[data-bg]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.bg === st.bg)); });
  document.querySelectorAll('[data-hero]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.hero === st.hero)); });
  document.querySelectorAll('.hero').forEach(function (b) { b.hidden = st.view !== 'paper'; });
  document.querySelectorAll('[data-ht]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.ht === st.ht)); });
  document.querySelectorAll('[data-pk]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.pk === st.pk)); });
  document.querySelectorAll('.pkl').forEach(function (b) { b.hidden = st.view !== 'open'; });
  document.querySelectorAll('[data-ly]').forEach(function (b) { var kv = b.dataset.ly.split('='); b.setAttribute('aria-pressed', String(st.ly[kv[0]] === kv[1])); });
  document.querySelectorAll('.lyl').forEach(function (b) { b.hidden = st.view !== 'layers'; });
  document.querySelectorAll('[data-fg]').forEach(function (b) { var kv = b.dataset.fg.split('='); b.setAttribute('aria-pressed', String(st.fg[kv[0]] === kv[1])); });
  document.querySelectorAll('.fgl').forEach(function (b) { b.hidden = st.view !== 'compactN'; });
  document.querySelectorAll('.htl').forEach(function (b) { b.hidden = st.view !== 'paper'; });
  document.querySelectorAll('[data-pat]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.pat === st.pat)); });
  document.querySelectorAll('.pat').forEach(function (b) { b.hidden = !SITE || st.view !== 'paper'; });
  document.querySelectorAll('[data-art]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.art === st.art)); });
  document.querySelectorAll('.art').forEach(function (b) { b.hidden = !SITE; });
  var ph = document.getElementById('ph'); ph.setAttribute('aria-pressed', String(st.mode === 'photo')); ph.hidden = st.view !== 'garden';
  try { localStorage.setItem('vj-preview', JSON.stringify(st)); } catch (e) {}
  layout();
}
document.querySelector('.tb').addEventListener('wheel', function (e) { var t = e.currentTarget; if (t.scrollWidth > t.clientWidth && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { t.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
document.querySelector('.tb').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.view) { st.view = b.dataset.view; send({ view: st.view }); }
  else if (b.dataset.bg) { st.bg = b.dataset.bg; send({ bg: st.bg }); }
  else if (b.dataset.art) { st.art = b.dataset.art; send({ art: st.art }); }
  else if (b.dataset.hero) { st.hero = b.dataset.hero; send({ hero: st.hero }); }
  else if (b.dataset.pat) { st.pat = b.dataset.pat; send({ pat: st.pat }); }
  else if (b.dataset.ly) { var kv = b.dataset.ly.split('='); st.ly[kv[0]] = kv[1]; var o = {}; o[kv[0]] = kv[1]; send({ ly: o }); }
  else if (b.dataset.fg) { var kf = b.dataset.fg.split('='); st.fg[kf[0]] = kf[1]; var of = {}; of[kf[0]] = kf[1]; send({ fg: of }); }
  else if (b.dataset.pk) { st.pk = b.dataset.pk; send({ pk: st.pk }); }
  else if (b.dataset.ht) { st.ht = b.dataset.ht; send({ ht: st.ht }); }
  else if (b.dataset.dev) st.dev = b.dataset.dev;
  else if (b.dataset.mode) { st.mode = st.mode === 'photo' ? 'text' : 'photo'; send({ mode: st.mode }); }
  sync();
});
window.addEventListener('message', function (e) { if (e.data && e.data.ready) e.source.postMessage({ view: st.view, mode: st.mode, bg: st.bg, art: st.art, hero: st.hero, pat: st.pat, ht: st.ht, pk: st.pk, fg: st.fg, ly: st.ly, lyop: st.lyop, zugx: st.zugx }, '*'); });
window.addEventListener('resize', layout);
sync();

(function () { var r = document.getElementById('zugx'), o = document.getElementById('zugxv');
  st.zugx = 30; r.value = 30; o.textContent = '30%';
  r.addEventListener('input', function () { st.zugx = +r.value; o.textContent = r.value + '%'; send({ zugx: st.zugx }); }); })();
(function () { var r = document.getElementById('lyop'), o = document.getElementById('lyopv');
  if (typeof st.lyop !== 'number') st.lyop = 70; r.value = st.lyop; o.textContent = st.lyop + '%';
  r.addEventListener('input', function () { st.lyop = +r.value; o.textContent = r.value + '%'; send({ lyop: st.lyop }); try { localStorage.setItem('vj-preview', JSON.stringify(st)); } catch (e) {} }); })();
</script></body></html>
